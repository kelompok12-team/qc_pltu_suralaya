<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoalQC Suralaya</title>
<style>
:root{--bg:#eef1f0;--sf:#fff;--tx:#18262e;--mu:#5d6d75;--ln:#d5dcdd;--ac:#0e6670;--ok:#2a8a55;--wr:#c98a00;--bd:#c23b2e;--hd:#16252d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--sf:#192329;--tx:#e6eceb;--mu:#98a8ad;--ln:#2b3a41;--ac:#47b3bd;--ok:#4cc27f;--wr:#e5b13a;--bd:#ec6a5c;--hd:#0b1115}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:#e6eceb;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}header small{display:block;color:#9fb0b5;font-weight:400;font-size:12px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;width:100%}
header select{width:auto;background:#22343d;color:#fff;border-color:#34505b}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--mu)}
nav button.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px}
button.kpi{color:inherit;text-align:left;cursor:pointer}.kpi.on{outline:2px solid var(--ac)}.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.Lulus,.Normal{background:var(--ok)}.Gagal,.Kritis{background:var(--bd)}.Belum{background:#76878d}.Waspada{background:var(--wr)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}.btn.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.seg{display:flex;gap:4px}.seg label{margin:0;display:flex;align-items:center;gap:4px;padding:5px 11px;border:1px solid var(--ln);border-radius:6px;cursor:pointer;color:var(--tx)}
.seg input{width:auto}.seg label:has(input:checked){background:var(--ok);color:#fff;border-color:var(--ok)}.seg label.n:has(input:checked){background:var(--bd);border-color:var(--bd)}
.rec{padding:10px 12px;border-radius:6px;margin:12px 0;font-weight:600;color:#fff}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bd)}
.assets{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.asset{border-left:6px solid var(--ok)}.asset.Waspada{border-color:var(--wr)}.asset.Kritis{border-color:var(--bd)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--bd);font-size:13px}.alert{background:var(--bd);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bd);font-weight:600}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}.box{border-color:#999}.pk{display:block!important}}
.pk{display:none;text-align:center;border-bottom:2px solid #000;margin-bottom:10px}
</style></head><body>
<header><h1>CoalQC Suralaya<small>Monitoring kualitas batubara dan kesehatan alat · PLTU Suralaya, Cilegon</small></h1>
<div id="who" style="display:flex;gap:10px;align-items:center"></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const CH=["Kondisi fisik (benda asing, kebasahan, ukuran)","Jumlah/tonase sesuai dokumen","Spesifikasi sesuai kontrak","Kelengkapan dokumen (DO, COA)","Kondisi tongkang/muatan"];
const TH={gcv:{n:"GCV (kcal/kg, ar)",min:4000,max:null},tm:{n:"Total Moisture (%ar)",min:null,max:32},ash:{n:"Ash (%adb)",min:null,max:8},ts:{n:"Total Sulphur (%adb)",min:null,max:0.8}};
let sup=["PT Bara Nusantara","PT Kalimantan Energi","CV Sumsel Mining","PT Mahakam Jaya"];
let G=[];const seed=[["2026-08-04",0,5200,"Lulus"],["2026-08-19",1,4800,"Gagal"],["2026-09-02",2,6100,"Lulus"],["2026-09-11",3,5500,"Lulus"],["2026-09-23",1,4900,"Gagal"],["2026-10-03",0,7000,"Lulus"],["2026-10-12",2,5800,"Lulus"],["2026-10-20",3,6400,"Gagal"],["2026-10-27",0,6900,"Lulus"],["2026-10-30",1,5300,"Belum"],["2026-10-31",2,6000,"Belum"]];
seed.forEach((s,i)=>G.push({id:i+1,doc:"DO-"+(2610+i),date:s[0],sup:s[1],barge:"TK Samudra "+(i+1),grade:["Medium","Low Rank"][i%2],ton:s[2],st:s[3],note:s[3]=="Gagal"?"Parameter di luar spesifikasi":"",gcv:4150+(i*37)%400,tm:28+(i*3)%7,ash:5+(i%4)}));
let A=[["CV-01","Conveyor","Unit 1","Normal"],["CV-02","Conveyor","Unit 3","Waspada"],["CB-01","Coal Bunker","Unit 2","Normal"],["CF-04","Coal Feeder","Unit 4","Normal"],["PU-03","Pulverizer","Unit 5","Kritis"],["PU-06","Pulverizer","Unit 7","Normal"],["BL-01","Boiler","Unit 1","Normal"],["BL-06","Boiler","Unit 6","Waspada"]].map(a=>({code:a[0],type:a[1],unit:a[2],st:a[3],last:"2026-10-3"+(Math.floor(Math.random()*2))}));
const AC={"Conveyor":["Kondisi belt (sobek/aus/misalignment)","Roller dan bearing","Suhu bearing/motor","Pengaman (pull cord)"],"Coal Bunker":["Level dan bridging/rat-holing","Suhu bunker (self-heating)","Deteksi CO","Chute tidak tersumbat"],"Coal Feeder":["Laju umpan sesuai kalibrasi","Kondisi belt feeder","Motor dan gearbox","Tidak ada penyumbatan"],"Pulverizer":["Arus motor normal","Differential pressure","Suhu outlet","Fineness (mesh)","Roller/grinding ring"],"Boiler":["Suhu furnace","Tekanan steam","Indikasi slagging/fouling","Kondisi burner","O₂ flue gas"]};
const SH={"CV-02":[["Kondisi belt (sobek/aus/misalignment)"],"Belt bergeser ke sisi kiri"],"PU-03":[["Arus motor normal","Differential pressure"],"Arus motor tinggi dan DP naik"],"BL-06":[["Indikasi slagging/fouling"],"Slagging di dinding furnace"]};
A.forEach(a=>{if(SH[a.code])a.h=[{d:"2026-10-30",s:a.st,n:SH[a.code][1],by:"Petugas QC",it:SH[a.code][0]}]});
let RP=[],cl=null,fm="";
let role=null,me=null,page="dash",sel=null,ins=null,F={},dk=null,tp="gcv",ts="",L=[],ph=[],RR=[];let TG={"Low Rank":{gcv:4000,tm:32,ash:8,ts:0.8},"Medium":{gcv:5000,tm:25,ash:7,ts:0.8}},SO={k:"date",d:-1},PG={rep:1,in:1};let U=[{u:"admin",p:"admin123",r:"adm",n:"Admin Logistik"},{u:"qc",p:"qc123",r:"qc",n:"Petugas QC"},{u:"spv",p:"spv123",r:"sup",n:"Supervisor"},{u:"mek1",p:"mek123",r:"mek",n:"Budi Santoso"},{u:"mek2",p:"mek123",r:"mek",n:"Andi Pratama"}];
const NAV={sup:[["dash","Dashboard"],["rep","Laporan"],["ast","Kesehatan alat"],["rw","Riwayat perbaikan"],["log","Audit log"]],adm:[["in","Barang masuk"],["sp","Supplier"],["set","Pengaturan"],["log","Audit log"]],qc:[["qc","Pemeriksaan QC"],["ast","Kesehatan alat"]],mek:[["mk","Mesin rusak"],["rw","Riwayat perbaikan"]]};
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jakarta"}),nowT=()=>new Date().toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit"}).replace(".",":"),$=s=>document.querySelector(s),fd=d=>d.split("-").reverse().join("-"),nf=n=>n.toLocaleString("id-ID");
const tag=s=>`<span class="tag ${s}">${s=="Belum"?"Belum diperiksa":s=="Lulus"?"Lulus QC":s=="Gagal"?"Gagal QC":s}</span>`;
function login(){return `<div class="box" style="max-width:380px;margin:30px auto"><h2>Masuk</h2><label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')doLogin()"><p><button class="btn" onclick="doLogin()">Masuk</button> <span class="err" id="le"></span></p></div>`}
const K="coalqc1";let fails=0,lock=0,idle=Date.now();
async function hs(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("coalqc:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function save(){try{localStorage.setItem(K,JSON.stringify({G,sup,A,TH,CH,U,L,TG,RP,v:2}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s){G=s.G;sup=s.sup;A=s.A;Object.assign(TH,s.TH);CH.splice(0,CH.length,...s.CH);U=s.U;L=s.L;TG=s.TG;RP=s.RP||[];if(!s.v){[["mek1","Budi Santoso"],["mek2","Andi Pratama"]].forEach(m=>{if(!U.some(x=>x.u==m[0]))U.push({u:m[0],p:"mek123",r:"mek",n:m[1]})})}}}catch(e){}}
async function init(){load();for(const u of U)if(!u.h){u.p=await hs(u.p);u.h=1}save();draw()}
document.addEventListener("click",()=>idle=Date.now());setInterval(()=>{if(role&&Date.now()-idle>9e5)out()},30000);
async function doLogin(){if(Date.now()<lock){le.textContent="Terlalu banyak percobaan. Coba lagi dalam 30 detik.";return}const h=await hs(lp.value),u=U.find(x=>x.u==lu.value&&x.p==h);if(!u){if(++fails>=3){lock=Date.now()+3e4;fails=0}le.textContent="Username atau password salah.";return}fails=0;idle=Date.now();me=u;role=u.r;page=NAV[role][0][0];log("Login");draw()}
function prob(a){const h=(a.h||[]).find(x=>!x.fix&&x.s!="Normal");if(!h)return"Belum ada rincian temuan dari QC.";const p=[];if(h.it&&h.it.length)p.push("Item NOT OK: "+h.it.join("; "));if(h.n&&h.n!="-")p.push(h.n);return p.join(". ")||"-"}
function mk(){const br=A.filter(a=>a.st!="Normal").sort((a,b)=>(b.st=="Kritis")-(a.st=="Kritis")),kr=br.filter(a=>a.st=="Kritis").length,mine=RP.filter(r=>r.u==me.u).length;
if(cl){const a=A.find(x=>x.code==cl);return `<h2>Klaim selesai: ${a.type} ${a.code}</h2><div class="box"><p class="mu" style="margin-top:0">${a.unit} · ${tag(a.st)}</p><p><b>Masalah dari QC:</b> ${E(prob(a))}</p><p>Diselesaikan oleh: <b>${E(me.n)}</b></p><label for="mkn">Tindakan perbaikan yang dilakukan (wajib)</label><textarea id="mkn" rows="3"></textarea><label for="mkp">Sparepart / material yang dipakai (opsional)</label><input id="mkp"><p><button class="btn" onclick="claim('${a.code}')">Klaim selesai</button> <button class="btn alt" onclick="cl=null;draw()">Batal</button> <span class="err" id="mke"></span></p><p class="mu">Setelah diklaim, status alat berubah menjadi Normal dan tercatat atas nama Anda.</p></div>`}
return `<h2>Mesin rusak</h2><p class="mu">${br.length?`${br.length} mesin perlu diperbaiki${kr?`, ${kr} di antaranya kritis`:""}. Kamu sudah menyelesaikan ${mine} perbaikan.`:`Kamu sudah menyelesaikan ${mine} perbaikan.`}</p>${br.length?`<div class="grid assets">${br.map(a=>`<div class="box asset ${a.st}"><b>${a.type} ${a.code}</b><div class="mu">${a.unit} · inspeksi ${fd(a.last)}</div><p style="margin:8px 0">${tag(a.st)}</p><p style="margin:0 0 10px;white-space:normal">${E(prob(a))}</p><button class="btn" onclick="cl='${a.code}';draw()">Klaim selesai</button></div>`).join("")}</div>`:`<div class="box">Semua mesin dalam kondisi normal. Tidak ada yang perlu diperbaiki.</div>`}`}
function rwList(){return RP.filter(r=>!fm||r.u==fm)}
function rw(){const r=rwList(),mks=[...new Set(RP.map(x=>x.u))].map(u=>[u,RP.find(x=>x.u==u).by]);return `<h2>Riwayat perbaikan</h2><div class="box np"><div class="row"><div><label for="fmk">Mekanik</label><select id="fmk" onchange="fm=this.value;draw()"><option value="">Semua mekanik</option>${mks.map(m=>`<option value="${E(m[0])}" ${fm==m[0]?"selected":""}>${E(m[1])}</option>`).join("")}</select></div></div>${role=="sup"?`<p><button class="btn alt" onclick="pdfRw()">Cetak / simpan PDF</button> <button class="btn alt" onclick="xlRw()">Unduh Excel (.xlsx)</button></p>`:""}</div><div class="box tw" style="margin-top:12px"><p class="mu">${r.length} perbaikan selesai</p><table><tr><th>Tanggal</th><th>Jam</th><th>Alat</th><th>Unit</th><th>Kondisi awal</th><th>Masalah</th><th>Tindakan</th><th>Material</th><th>Diselesaikan oleh</th></tr>${r.map(x=>`<tr><td>${fd(x.d)}</td><td>${x.t}</td><td>${x.type} ${x.code}</td><td>${x.unit}</td><td>${tag(x.bef)}</td><td style="white-space:normal;min-width:200px">${E(x.prob)}</td><td style="white-space:normal;min-width:200px">${E(x.act)}</td><td>${E(x.part)||"-"}</td><td><b>${E(x.by)}</b></td></tr>`).join("")||`<tr><td colspan="9">Belum ada perbaikan yang diklaim selesai.</td></tr>`}</table></div>`}
function claim(c){const a=A.find(x=>x.code==c);if(!mkn.value.trim()){mke.textContent="Isi tindakan perbaikan yang dilakukan.";return}const d=today(),t=nowT(),act=mkn.value.trim();RP.unshift({code:a.code,type:a.type,unit:a.unit,bef:a.st,prob:prob(a),act,part:mkp.value.trim(),by:me.n,u:me.u,d,t});a.st="Normal";a.last=d;a.fx={by:me.n,d,t};(a.h=a.h||[]).unshift({d,s:"Normal",n:"Perbaikan selesai: "+act,by:me.n,fix:1});log("Perbaikan selesai "+c+" ("+a.type+")");cl=null;draw()}
function pager(k,n){return `<div class="np" style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="btn alt" ${PG[k]<=1?"disabled":""} onclick="PG['${k}']--;draw()">Sebelumnya</button><span class="mu">Halaman ${PG[k]} dari ${n}</span><button class="btn alt" ${PG[k]>=n?"disabled":""} onclick="PG['${k}']++;draw()">Berikutnya</button></div>`}
function srt(k){SO.d=SO.k==k?-SO.d:1;SO.k=k;draw()}
function out(){log("Logout");role=me=null;sel=ins=cl=null;draw()}
function log(a){L.unshift({t:new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta"}),u:me?me.n:"-",a})}
function go(p){page=p;sel=ins=cl=null;draw()}
function draw(){save();$("#nav").innerHTML=(NAV[role]||[]).map(n=>`<button class="${n[0]==page?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");$("#app").innerHTML=role?({dash,rep,ast,in:inp,sp,qc,log:lg,set:st,mk,rw})[page]():login();$("#who").innerHTML=role?`${me.n} <button class="btn alt" style="color:#fff;border-color:#fff" onclick="out()">Keluar</button>`:"";if(page=="qc"&&sel)rec()}
function donut(l,g,b){const t=l+g+b||1,c=2*Math.PI*40;let o=0;const seg=(v,col)=>{const d=v/t*c,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${d} ${c-d}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=d;return s};
return `<svg viewBox="0 0 120 120" width="150" role="img" aria-label="Lulus ${l}, Gagal ${g}, Belum ${b}">${seg(l,"var(--ok)")}${seg(g,"var(--bd)")}${seg(b,"#76878d")}<text x="60" y="66" text-anchor="middle" font-size="20" fill="currentColor">${Math.round(l/((l+g)||1)*100)}%</text></svg>`}
function dash(){const l=G.filter(x=>x.st=="Lulus").length,g=G.filter(x=>x.st=="Gagal").length,b=G.filter(x=>x.st=="Belum").length,tot=G.reduce((a,x)=>a+x.ton,0);
const mo={};G.forEach(x=>{const m=x.date.slice(0,7);mo[m]=(mo[m]||0)+x.ton});const ks=Object.keys(mo).sort(),mx=Math.max(...ks.map(k=>mo[k]));
const bars=ks.map((k,i)=>{const h=mo[k]/mx*110;return `<rect x="${20+i*70}" y="${130-h}" width="46" height="${h}" fill="var(--ac)"/><text x="${43+i*70}" y="146" text-anchor="middle" font-size="11" fill="currentColor">${k.slice(5)}/${k.slice(2,4)}</text><text x="${43+i*70}" y="${124-h}" text-anchor="middle" font-size="10" fill="currentColor">${nf(mo[k])}</text>`}).join("");
const rk=sup.map((s,i)=>{const a=G.filter(x=>x.sup==i&&x.st!="Belum"),f=a.filter(x=>x.st=="Gagal").length;return [s,a.length?Math.round(f/a.length*100):0]}).sort((a,b)=>b[1]-a[1]);
const kr=A.filter(a=>a.st=="Kritis");
return `<h2>Dashboard</h2>${kr.map(a=>`<div class="alert">Alat KRITIS: ${a.type} ${a.code} (${a.unit}). Perlu tindakan segera.</div>`).join("")}
<p class="mu np">Klik kartu untuk melihat datanya.</p><div class="grid g4">${[["Semua",nf(tot)+" ton","Total barang masuk ("+G.length+" kedatangan)",""],["Lulus",l,"Lulus QC","ok"],["Gagal",g,"Gagal QC","bad"],["Belum",b,"Belum diperiksa",""]].map(k=>`<button class="box kpi ${dk==k[0]?"on":""}" onclick="dk='${k[0]}';draw()"><b class="${k[3]}">${k[1]}</b><span>${k[2]}</span></button>`).join("")}</div>${dk?det():""}
<div class="grid g2" style="margin-top:12px"><div class="box"><h3>Lulus vs gagal QC</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(l,g,b)}<div class="mu">Hijau: lulus (${l})<br>Merah: gagal (${g})<br>Abu-abu: belum (${b})</div></div></div>
<div class="box"><h3>Tonase masuk per bulan (ton)</h3><svg viewBox="0 0 ${ks.length*70+20} 155" width="100%" role="img" aria-label="Tonase per bulan">${bars}</svg></div>
<div class="box"><h3>Tingkat kegagalan per supplier</h3>${rk.map(r=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${r[0]}</span><b>${r[1]}%</b></div><div class="bar"><i style="width:${r[1]}%"></i></div></div>`).join("")}</div>
<div class="box" style="grid-column:1/-1">${trend()}</div><div class="box"><h3>Kesehatan alat</h3>${["Normal","Waspada","Kritis"].map(s=>`<p style="margin:6px 0">${tag(s)} <b>${A.filter(a=>a.st==s).length}</b> aset</p>`).join("")}<button class="btn alt" onclick="go('ast')">Lihat semua alat</button></div></div>`}
function rep(){const f=F,rows=RR=G.filter(x=>x.st!="Belum"&&(!f.a||x.date>=f.a)&&(!f.b||x.date<=f.b)&&(!f.s||x.sup==f.s)&&(!f.t||x.st==f.t)&&(!f.q||(x.doc+sup[x.sup]+x.barge).toLowerCase().includes(f.q.toLowerCase())));
